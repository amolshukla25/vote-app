<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f1a">
  <link rel="icon" href="data:,">
  <title>Live Results — Art Showdown</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="bg-decor"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1 id="eventTitle">Art Showdown</h1>
    </div>
    <span class="badge badge-live">Live</span>
    <div id="statusBadge" class="badge badge-open">Voting open</div>
  </header>

  <main class="lb-wrap">
    <div class="lb-stats">
      <div class="stat-chip">Total votes <b id="totalVotes">0</b></div>
      <div class="stat-chip" id="voterCount">—</div>
    </div>

    <div class="lb-hero">
      <div class="podium" id="podium"></div>
      <aside class="qr-card">
        <img id="qrImg" alt="QR code to vote">
        <p><b>Scan to vote</b><br>from your phone</p>
      </aside>
    </div>

    <div class="winner-banner" id="winnerBanner" hidden></div>

    <div class="tabs" id="lbTabs"></div>
    <div class="lb-list" id="lbList"></div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/leaderboard.js"></script>
</body>
</html>
